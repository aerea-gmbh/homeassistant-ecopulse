# Mirror of the GitLab test job, so pull requests on the GitHub mirror are checked too.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.13"
            requirements: requirements_test_min.txt
            constraints: ci/constraints-2025.10.4.txt
          - python: "3.14"
            requirements: requirements_test.txt
            constraints: ci/constraints-2026.10.0.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -c "${{ matrix.constraints }}" -r "${{ matrix.requirements }}"
      - run: ruff check . && ruff format --check .
        if: matrix.python == '3.14'
      - run: pytest
